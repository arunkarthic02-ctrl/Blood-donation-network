spring.application.name=backend
server.port=${PORT:8080}

# Cloud & Local Database Configuration
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blooddonation}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${DB_USER:root}}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Central CORS allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Demo Data Seeder flag
app.seed-demo-data=${SEED_DEMO_DATA:false}