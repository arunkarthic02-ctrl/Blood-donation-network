version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: blooddonation-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: blooddonation
      MYSQL_USER: blooduser
      MYSQL_PASSWORD: bloodpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bloodconnect-network

  # Spring Boot Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bloodconnect-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blooddonation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: blooduser
      SPRING_DATASOURCE_PASSWORD: bloodpassword
      HIBERNATE_DDL_AUTO: update
      SHOW_SQL: "false"
    ports:
      - "8080:8080"
    networks:
      - bloodconnect-network

  # React Frontend Service (Production Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: bloodconnect-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - bloodconnect-network

volumes:
  mysql_data:
    driver: local

networks:
  bloodconnect-network:
    driver: bridge
